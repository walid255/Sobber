# Cloudflare Wrangler Configuration for SerenityCare
name = "serenitycare-sober-house"
main = "cloudflare/worker.js"
compatibility_date = "2024-09-01"

# Cloudflare D1 SQL Relational Database Binding
[[d1_databases]]
binding = "DB"
database_name = "serenitycare-db"
database_id = "your-d1-database-id-here"

# Cloudflare KV Namespace for Fast Sessions & Caching
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id-here"

# Cloudflare R2 Storage Bucket for Resident Photos & Dossiers
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "serenitycare-storage"

# Static Assets for SPA
[site]
bucket = "./"
